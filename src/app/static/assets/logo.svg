<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VieTrueVoice Logo">
  <defs>
    <linearGradient id="vtv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171c" />
      <stop offset="100%" stop-color="#0b0b0e" />
    </linearGradient>
    <linearGradient id="vtv-emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6dffba" />
      <stop offset="100%" stop-color="#00e599" />
    </linearGradient>
  </defs>

  <!-- Brutalist chamfered obsidian tile with crisp emerald frame -->
  <polygon
    points="3,3 48,3 61,16 61,61 16,61 3,48"
    fill="#00e599"
  />
  <polygon
    points="6.2,6.2 46.7,6.2 57.8,17.3 57.8,57.8 17.3,57.8 6.2,46.7"
    fill="url(#vtv-bg)"
  />

  <!-- Top-right forensic crimson machined corner tab -->
  <polygon points="52.5,3 61,3 61,11.5" fill="#df0042" />

  <!-- Bold geometric V acoustic shield -->
  <polygon
    points="11.5,19 19.3,19 32,43.2 44.7,19 52.5,19 34.8,52.5 29.2,52.5"
    fill="url(#vtv-emerald)"
  />

  <!-- 3-bar forensic voiceprint pulse centered cleanly inside V aperture -->
  <rect x="23.5" y="16" width="3.8" height="9" fill="#6dffba" />
  <rect x="30.1" y="12.5" width="3.8" height="17" fill="#df0042" />
  <rect x="36.7" y="16" width="3.8" height="9" fill="#6dffba" />
</svg>
